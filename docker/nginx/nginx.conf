events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Upstream định tuyến Lõi Laravel
    upstream backend_kernel {
        server laravel-core:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # -------------------------------------------------------------
        # 1. API CORE GATEWAY (Laravel 11 Microkernel)
        # -------------------------------------------------------------
        location /api/core/ {
            proxy_pass http://backend_kernel/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Hỗ trợ truyền nguyên vẹn các header bảo mật Zero-Trust
            proxy_pass_header X-Module-ID;
            proxy_pass_header X-HMAC-Signature;
            proxy_pass_header X-Timestamp;
            proxy_pass_header Authorization;

            # Hỗ trợ Server-Sent Events (SSE) thời gian thực không đệm
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 24h;
        }

        # -------------------------------------------------------------
        # 2. CHUẨN HÓA ĐƯỜNG DẪN MODULE & FRONTEND/DIST (Item 15)
        # -------------------------------------------------------------
        # Hỗ trợ URL trực tiếp /modules/*/frontend/dist/*
        rewrite ^/modules/([^/]+)/frontend/dist/(.*)$ /modules/$1/$2;

        # Chuẩn hóa tên định danh module (VD: shop-module -> shop)
        rewrite ^/modules/shop-module/(.*)$ /modules/shop/$1;
        rewrite ^/modules/helloworld-module/(.*)$ /modules/helloworld/$1;
        rewrite ^/modules/forum-module/(.*)$ /modules/forum/$1;

        # -------------------------------------------------------------
        # 3. VỆ TINH MODULES (Static Assets & Micro-Frontends)
        # -------------------------------------------------------------
        # Phục vụ các module tĩnh với caching 30 ngày cho các asset bundle
        location /modules/ {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ @module_not_found;
            add_header Access-Control-Allow-Origin *;

            # Caching 30 ngày cho toàn bộ static assets (.js, .css, fonts, images) trong /modules/
            location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
                expires 30d;
                add_header Cache-Control "public, max-age=2592000, immutable";
                add_header Access-Control-Allow-Origin *;
                try_files $uri =404;
            }
        }

        # Fallback xử lý khi thư mục dist của module chưa được build (Item 10)
        location @module_not_found {
            default_type text/html;
            return 404 '<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><title>Modular-OS | Module Not Built</title><style>body{background:#030712;color:#94a3b8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center;}div{background:#0f172a;border:1px solid rgba(239,68,68,0.3);padding:2.5rem;border-radius:1rem;max-width:480px;box-shadow:0 20px 40px rgba(0,0,0,0.8);}h2{color:#f87171;margin-top:0;}code{background:rgba(255,255,255,0.08);padding:0.2rem 0.5rem;border-radius:4px;color:#a5b4fc;}a{color:#818cf8;text-decoration:none;font-weight:600;display:inline-block;margin-top:1rem;}</style></head><body><div><h2>Module Chưa Được Biên Dịch</h2><p>Thư mục static <code>dist</code> của module này chưa tồn tại hoặc chưa được build.</p><p>Vui lòng chạy lệnh: <br><code>npm run build:modules</code></p><a href="/portal">&larr; Quay lại Cổng Tổng (Portal Hub)</a></div></body></html>';
        }

        # -------------------------------------------------------------
        # 4. REACT 18 HOST SHELL (Giao diện vỏ bọc chính - SPA)
        # -------------------------------------------------------------
        location / {
            root /usr/share/nginx/html/shell;
            index index.html;
            try_files $uri $uri/ /index.html @shell_not_found;
            add_header Access-Control-Allow-Origin *;

            location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
                expires 30d;
                add_header Cache-Control "public, max-age=2592000, immutable";
                add_header Access-Control-Allow-Origin *;
                try_files $uri =404;
            }
        }

        location @shell_not_found {
            default_type text/html;
            return 503 '<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><title>Modular-OS | Shell Not Ready</title><style>body{background:#030712;color:#94a3b8;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center;}div{background:#0f172a;border:1px solid rgba(99,102,241,0.3);padding:2.5rem;border-radius:1rem;max-width:480px;}h2{color:#818cf8;margin-top:0;}code{background:rgba(255,255,255,0.08);padding:0.2rem 0.5rem;border-radius:4px;color:#a5b4fc;}</style></head><body><div><h2>Host Shell Đang Khởi Động</h2><p>Host Shell chưa được biên dịch. Vui lòng chạy:<br><code>npm run build:shell</code></p></div></body></html>';
        }
    }
}
